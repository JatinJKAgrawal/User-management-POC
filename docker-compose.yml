name: user-management

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-usermgmt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP server that captures onboarding emails. UI: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # One-shot job that applies migrations before the API starts.
  migrate:
    build: .
    image: user-management-api:local
    entrypoint: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-usermgmt}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: user-management-api:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-usermgmt}?sslmode=disable
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_DRIVER: smtp
      HTTP_PORT: "8080"
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-32+-chars}
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:-change-me-platform-api-key}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailhog:
        condition: service_started

volumes:
  pgdata:
